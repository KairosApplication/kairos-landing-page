<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kairos - Cadastro ou Login</title> 
<link rel="stylesheet" href="Cadastro1.css">
<script src="Login.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
 
  <div class="page">
    <div class="circulo"></div>
 
    <a href="Inter.html" class="logo">
      <img src="Assets/Group 6.svg" alt="Logo Kairos">
      
    </a>
 
    <div class="container">
      <div class="left-col">
        <h1>Cadastre-se ou<br>faça Login!</h1>
 
        <div class="illustration">
          <img src="Assets/amico.svg" alt="Ilustração de login">
        </div>
      </div>
 
      <div class="form-card">
        <div class="tabs">
          <button class="tab active" type="button">Cadastro</button>
          <a href="login.html" class="tab"><button class="tab" type="button">Login</button> </a>
        </div>
        <div class="field">
          <label for="Data">Data de nascimento</label>
          <div class="input-wrap">
            <input type="date" id="datadenascimento" placeholder="16/05/1986">
          </div>
        </div>
 
        <div class="field">
          <label for="CPF">CPF</label>
          <div class="input-wrap">
            <input type="text" id="cpf" name="number" placeholder="786.160.328-86">
          </div>
        </div>
 
          <div class="field">
            <label for="CEP">CEP</label>
            <div class="input-wrap">
              <input type="text" id="CEP" placeholder="16500-970">
                
                </svg>
              </span>
            </div>
          </div>
          
        <div class="tabs">
            <a href="Cadastro.html" class="tab"><button class="tab" type="button">Voltar</button> </a>          
          <button class="tab active" type="button">Criar Conta</button>
        </div>
        
        <p class="terms">
          Ao continuar, você concorda com nossos<br>
          <a href="#">Termos de Uso</a>
        </p>
      </div>
    </div>
  </div>

</body>
</html>
